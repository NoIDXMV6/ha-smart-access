name: Release (HACS)

# Нормальная версионность для HACS: при изменении версии интеграции
# (custom_components/smart_access/manifest.json) в main автоматически
# создаётся тег vX.Y.Z и публикуется GitHub Release с заметками из
# CHANGELOG.md. HACS сравнивает версию манифеста с релизами — после этого
# «Обновить» в HACS появляется само.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: ver
        run: |
          V=$(python3 -c "import json; print(json.load(open('custom_components/smart_access/manifest.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Integration version: $V"

      - name: Check if tag exists
        id: tag
        run: |
          V="${{ steps.ver.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$V already exists — release skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Релиз уходит только с зелёными тестами (не полагаемся на порядок
      # срабатывания отдельного workflow test.yml)
      - name: Run tests before release
        if: steps.tag.outputs.exists == 'false'
        run: |
          python3 -m pip install --upgrade pip -q
          pip install -q -r smart-access-core/requirements-ci.txt
          python3 -m pytest smart-access-core/tests/ -q --tb=short

      - name: Build changelog notes
        if: steps.tag.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          {
            echo "## Smart Access v$V"
            echo
            # секция этой версии из CHANGELOG (стиль заголовков «# 1.3.1»)
            awk -v hdr="# $V" '
              $0 == hdr {p=1; next}
              /^# /     {if (p) exit}
              p         {print}
            ' smart-access-core/CHANGELOG.md
            echo
            echo "---"
            echo
            echo "### Обновление"
            echo "- **Интеграция (HACS):** HACS → Smart Access (умный допуск) → Обновить. Версия берётся из этого релиза."
            echo "- **Аддон Smart Access Core:** Настройки → Дополнения → Smart Access Core → Обновить. Образ: \`ghcr.io/noidxmv6/smart-access-core-{amd64,aarch64}:$V\` (сборка build-addon)."
            echo "- Ручная установка: архив \`smart-access-hacs.zip\` во вложениях, распаковать \`custom_components/smart_access\` в \`<config>/custom_components/\`."
          } > release_notes.md
          cat release_notes.md

      - name: Pack integration zip
        if: steps.tag.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p /tmp/pack/custom_components
          cp -r custom_components/smart_access /tmp/pack/custom_components/
          cd /tmp/pack
          zip -r "$GITHUB_WORKSPACE/smart-access-hacs.zip" custom_components

      - name: Create tag and release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "smart-access-bot"
          git config user.email "bot@users.noreply.github.com"
          git tag -a "v$V" -m "Smart Access v$V"
          git push origin "v$V"
          gh release create "v$V" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smart Access v$V" \
            --notes-file release_notes.md \
            --latest \
            smart-access-hacs.zip
