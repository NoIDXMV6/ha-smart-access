# Карточка «Живое видео + кнопки Открыть / Обучить» — шлагбаум ЕГДС (ул. Лесная)
#
# ЕСЛИ КНОПКА «Обучить» ПИШЕТ «Действие smart_access.enroll не найдено»:
#   сервис живёт в ИНТЕГРАЦИИ Smart Access (не в карточке). Проверьте:
#   1) HACS → Smart Access установлена и обновлена до 1.2.0+;
#   2) Настройки → Устройства и сервисы → Smart Access — интеграция ДОБАВЛЕНА;
#   3) после установки/обновления перезапустите Home Assistant
#      (Настройки → Система → Перезапустить). С версии 1.2.0 сервисы
#      регистрируются сразу при старте — даже без завершённой настройки
#      интеграции и даже без брокера MQTT.
# v1.1.0
#
# Вставка: Панель → Изменить → Добавить карточку → Вручную → вставить → Сохранить.
#
# Новое в v1.1.0: кнопка «Обучить» (camera-plus) — снимает кадр с камеры и
# добавляет его в базу «своих» машин аддона Smart Access Core.

type: picture-elements
camera_view: live
camera_image: camera.ul_lesnaia_shlagbaum_no1_ul_lesnaia_kamera_no1
title: Шлагбаум — ул. Лесная
elements:
  # Кнопка «Открыть шлагбаум»
  - type: state-icon
    entity: button.ul_lesnaia_shlagbaum_no1_otkryt
    icon: mdi:boom-gate-arrow-up-outline
    style:
      top: 84%
      left: 86%
      color: white
      background: rgba(0, 0, 0, 0.45)
      border-radius: 50%
      padding: 12px
      transform: translate(-50%, -50%)
    tap_action:
      action: perform-action
      perform_action: egds.open_barrier
      target:
        entity_id: button.ul_lesnaia_shlagbaum_no1_otkryt
      confirmation:
        text: Открыть шлагбаум?

  # Кнопка «Обучить» — кадр в базу «своих» машин
  - type: icon
    icon: mdi:camera-plus
    style:
      top: 84%
      left: 70%
      color: white
      background: rgba(0, 0, 0, 0.45)
      border-radius: 50%
      padding: 10px
      transform: translate(-50%, -50%)
    tap_action:
      action: perform-action
      perform_action: smart_access.enroll
      data:
        entity_id: camera.ul_lesnaia_shlagbaum_no1_ul_lesnaia_kamera_no1
        subject: Моя машина
        kind: car
      confirmation:
        text: Добавить текущий кадр в базу «Моя машина»?

  # Кнопка «во весь экран»
  - type: icon
    icon: mdi:arrow-expand-all
    style:
      top: 84%
      left: 14%
      color: white
      background: rgba(0, 0, 0, 0.45)
      border-radius: 50%
      padding: 10px
      transform: translate(-50%, -50%)
    tap_action:
      action: more-info
      entity: camera.ul_lesnaia_shlagbaum_no1_ul_lesnaia_kamera_no1

  # Подпись: состояние шлагбаума
  - type: state-label
    entity: cover.ul_lesnaia_shlagbaum_no1_shlagbaum
    style:
      top: 93%
      left: 50%
      color: white
      text-shadow: 0 0 4px black
      font-size: 95%
      transform: translate(-50%, -50%)
