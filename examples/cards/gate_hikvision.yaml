# Карточка калитки (домофония Hikvision) — ОБНОВЛЁННАЯ (v1.4.4):
# живое видео + кнопки «Открыть» / «Обучить» / «во весь экран».
#
# ГЛАВНОЕ ОТЛИЧИЕ от версии v1.1.0: живое видео карточка берёт с МОСТА Smart
# Access (сущность camera.smart_access_bridge_kalitka), а не напрямую с
# Универсальной камеры camera.kalitka. У физической камеры остаётся ОДИН
# получатель — мост (его же читает Frigate), карточка не открывает камере
# вторую сессию и не бывает серой.
#
# ТРЕБОВАНИЯ:
#   1) аддон Smart Access Core 1.4.0+ запущен, камера «Калитка» настроена
#      (ha_entity: camera.kalitka, mode: face);
#   2) интеграция Smart Access (HACS) 1.4.0+, ПОСЛЕ обновления HA перезапущен;
#   3) сущность моста создалась: Настройки → Устройства и службы → Сущности →
#      поиск «smart_access» → camera.smart_access_bridge_kalitka.
#
# ЕСЛИ СУЩНОСТИ МОСТА НЕТ:
#   * аддон запущен? Сущности создаются из MQTT-статуса аддона (он появляется
#     через ~30 с после старта аддона);
#   * интеграция обновлена до 1.4.0+ и HA перезапущен?
#   * запасной вариант: Универсальная камера с «URL кадра» (still_image_url)
#     http://172.30.32.1:8100/snapshot/kalitka — ссылку /mjpeg/… в поле
#     «Поток» вставлять НЕ нужно (HA не понимает multipart-поток).
#
# ЕСЛИ КНОПКА «Обучить» ПИШЕТ «Действие smart_access.enroll не найдено»:
#   сервис живёт в ИНТЕГРАЦИИ Smart Access (не в карточке). Проверьте:
#   1) HACS → Smart Access установлена и обновлена до 1.2.0+;
#   2) Настройки → Устройства и сервисы → Smart Access — интеграция ДОБАВЛЕНА;
#   3) после установки/обновления перезапустите Home Assistant
#      (Настройки → Система → Перезапустить). С версии 1.2.0 сервисы
#      регистрируются сразу при старте — даже без завершённой настройки
#      интеграции и даже без брокера MQTT. С 1.4.1 кнопка показывает результат
#      уведомлением (успех / причина отказа), исход виден и во вкладке
#      «Журнал» панели аддона.
#
# КАК ПОДКЛЮЧИТЬ КАМЕРУ В HA (один раз; камера нужна аддону как ha_entity,
# карточка при этом играет мост):
#   Настройки → Устройства и сервисы → Добавить интеграцию →
#   в поиске введите generic → выберите «Generic Camera»
#   (название в интерфейсе не переводится — «Универсальная камера» не ищется)
#     Поток:           rtsp://admin:ПАРОЛЬ@192.168.168.77:554/h264/ch01/main/av_stream
#     RTSP transport:  tcp
#     Имя:             Калитка        → получится сущность camera.kalitka
#   (если в пароле есть спецсимволы @ : / ? # — замените их в URL:
#    @→%40, :→%3A, /→%2F, ?→%3F, #→%23; «!» менять не нужно)
#   Экономнее указать в аддоне rtsp_url с подпотоком:
#   rtsp://admin:ПАРОЛЬ@192.168.168.77:554/h264/ch01/sub/av_stream
#
# ЗАМЕНИТЕ на свои сущности, если отличаются:
#   camera.smart_access_bridge_kalitka — сущность моста (картинка)
#   switch.door_door_relay_0           — реле открытия двери/калитки из Hik-Connect
#                                        (включается на мгновение, реле возвращается само)
#   sensor.smart_access_last_event     — последнее событие Smart Access (интеграция)
#   Имя для «Обучить»:                 — смените «Я» на имя члена семьи
#                                        (фото остальных добавляются в панели
#                                        Smart Access → Лица)
#
# Требуется: интеграция Hik-Connect (switch.door_door_relay_0), аддон
# smart-access-core 1.4.0+ + интеграция Smart Access (HACS) 1.4.0+, Mosquitto broker.

type: picture-elements
camera_view: live
camera_image: camera.smart_access_bridge_kalitka
title: Калитка — вход
elements:
  # Кнопка «Открыть калитку» (поверх видео, справа внизу)
  - type: state-icon
    entity: switch.door_door_relay_0
    icon: mdi:door-open
    style:
      top: 84%
      left: 86%
      color: white
      background: rgba(0, 0, 0, 0.45)
      border-radius: 50%
      padding: 12px
      transform: translate(-50%, -50%)
    tap_action:
      action: perform-action
      perform_action: switch.turn_on
      target:
        entity_id: switch.door_door_relay_0
      confirmation:
        text: Открыть калитку?

  # Кнопка «Обучить» — кадр с моста в базу лиц (слева от кнопки открытия)
  - type: icon
    icon: mdi:face-recognition
    style:
      top: 84%
      left: 70%
      color: white
      background: rgba(0, 0, 0, 0.45)
      border-radius: 50%
      padding: 10px
      transform: translate(-50%, -50%)
    tap_action:
      action: perform-action
      perform_action: smart_access.enroll
      data:
        entity_id: camera.smart_access_bridge_kalitka
        subject: Я
        kind: face
      confirmation:
        text: Добавить текущий кадр как лицо «Я»?

  # Кнопка «во весь экран» — диалог с живым видео моста (слева внизу)
  - type: icon
    icon: mdi:arrow-expand-all
    style:
      top: 84%
      left: 14%
      color: white
      background: rgba(0, 0, 0, 0.45)
      border-radius: 50%
      padding: 10px
      transform: translate(-50%, -50%)
    tap_action:
      action: more-info
      entity: camera.smart_access_bridge_kalitka

  # Подпись: последнее событие Smart Access (допуск/отказ/обучение)
  - type: state-label
    entity: sensor.smart_access_last_event
    style:
      top: 93%
      left: 50%
      color: white
      text-shadow: 0 0 4px black
      font-size: 95%
      transform: translate(-50%, -50%)
