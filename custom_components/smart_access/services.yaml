enroll:
  name: Обучить (сохранить «своего»)
  description: >-
    Снимает кадр с камеры и отправляет его в базу «своих» аддона Smart Access Core.
    Для машины — 8 аугментаций (сезоны/погода/свет), для лица — эмбеддинг SFace.
    Используется кнопкой «Обучить» на видео-карточках.
  fields:
    entity_id:
      name: Камера
      description: Камера, с которой взять кадр (шлагбаум или калитка).
      required: true
      example: camera.1_shlagbaum_derevnia_govorovo_15072_kamera
      selector:
        entity:
          domain: camera
    subject:
      name: Имя
      description: Имя машины или человека в базе (например «Моя машина», «Жена»).
      required: true
      example: Моя машина
      selector:
        text:
    kind:
      name: Тип
      description: auto — определить по привязке камеры (Настройки → Smart Access), car/face — явно.
      default: auto
      selector:
        select:
          options:
            - label: Авто (по привязке камеры)
              value: auto
            - label: Машина
              value: car
            - label: Лицо
              value: face
identify:
  name: Тест распознавания
  description: >-
    Снимает кадр и возвращает результат сопоставления с базой «своих».
    Результат приходит событием smart_access_ack (смотрите в Инструменты разработчика → События).
  fields:
    entity_id:
      name: Камера
      required: true
      selector:
        entity:
          domain: camera
    kind:
      name: Тип
      default: car
      selector:
        select:
          options:
            - label: Машина
              value: car
            - label: Лицо
              value: face
retrain:
  name: Переобучить базу
  description: >-
    Пересобирает прототипы распознавания по фактическим фотографиям
    (/media/smart_access/...). Выполняйте после удаления ошибочных фото
    или обновления моделей. Долгая операция — результат приходит событием
    smart_access_event (action: retrained) и виден в журнале панели.
  fields:
    kind:
      name: Тип базы
      required: true
      selector:
        select:
          options:
            - label: Машины
              value: car
            - label: Лица
              value: face
    subject:
      name: Имя (необязательно)
      description: Переобучить только одного. Без поля — вся база выбранного типа.
      required: false
      selector:
        text:
